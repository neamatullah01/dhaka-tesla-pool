version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dhaka-tesla-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: dhaka_tesla_pool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d dhaka_tesla_pool"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhaka-tesla-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@postgres:5432/dhaka_tesla_pool?schema=public
      - JWT_SECRET=supersecretjwt12345
      - JWT_REFRESH_SECRET=supersecretjwtrefresh12345
      - PORT=5000
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:5000/api/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhaka-tesla-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
