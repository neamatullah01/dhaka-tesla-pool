name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://dhaka-tesla-pool-yk51.onrender.com/api/docs | grep -q "200\|301\|302" && echo "Ping successful" || echo "Ping failed but workflow continues"
